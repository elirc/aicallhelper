<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      §10: model output is untrusted and reaches the DOM only as text nodes.
      No inline script is needed; style-src allows 'unsafe-inline' solely
      because Vite injects the stylesheet that way in dev — the markdown
      renderer itself never emits style or any other attribute from model text.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost"
    />
    <title>AI Call Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
