# Deterministic gates for AI Call Assistant (agreed action R6).
#
# `gates` runs on every push and pull request: frontend typecheck, tests and
# build, Rust core tests and clippy, Tauri shell tests, and the Python unit
# tests for the local speech service. No step touches the network beyond
# dependency downloads, a live provider or an audio device.
#
# `package` runs only when triggered by hand (workflow_dispatch) and uploads
# the NSIS installer. The manual build job is NOT release evidence on its own:
# a build becomes release evidence only when the manual checks in
# docs/RELEASE_CHECKLIST.md (Part A3) are run against that exact installer
# and recorded, with its SHA-256, in the results ledger (Part B).

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npx vitest run

      # Production bundle (tsc + vite build); the same build that
      # `npm run tauri build` runs before packaging.
      - name: Frontend build
        run: npm run build

      - name: Core tests
        working-directory: src-tauri
        run: cargo test -p app-core

      - name: Core clippy
        working-directory: src-tauri
        run: cargo clippy -p app-core -- -D warnings

      - name: Shell tests
        working-directory: src-tauri
        run: cargo test -p aicallhelper

      - name: Install pytest
        run: python -m pip install pytest

      - name: Local speech service tests
        run: python -m pytest -q local-voice/test_server.py

  package:
    # Manual only. Not release evidence on its own; see the header comment.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the NSIS installer
        run: npm run tauri build

      - name: Record installer SHA-256
        shell: pwsh
        run: Get-FileHash -Algorithm SHA256 src-tauri/target/release/bundle/nsis/*.exe | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
